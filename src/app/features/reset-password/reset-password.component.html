<mat-card class="shadow">
  <mat-card-header class="d-flex justify-content-start">
    <mat-card-title class="m-b-0">Modifier mon mot de passe</mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1 d-flex flex-column gap-16">
    <form
      [formGroup]="resetPasswordForm!"
      class="d-flex flex-column align-items-center"
    >
      <mat-form-field class="fields" appearance="outline">
        <mat-label>Nouveau mot de passe</mat-label>
        <input
          matInput
          type="password"
          [formControlName]="NEW_PASSWORD"
          required
        />
        <mat-error
          *ngIf="
            newPasswordControl.invalid &&
            (newPasswordControl.dirty || newPasswordControl.touched)
          "
        >
          Mot de passe invalide
        </mat-error>
      </mat-form-field>

      <mat-form-field class="fields" appearance="outline">
        <mat-label>Confirmer le mot de passe</mat-label>
        <input
          matInput
          type="password"
          [formControlName]="CONFIRM_PASSWORD"
          required
        />
        <mat-error
          *ngIf="
            confirmPasswordControl.invalid &&
            (confirmPasswordControl.dirty || confirmPasswordControl.touched)
          "
        >
          Confirmation invalide
        </mat-error>
      </mat-form-field>
      <ul
        *ngIf="newPasswordControl?.errors?.['passwordPolicy'] && (newPasswordControl?.dirty || newPasswordControl?.touched)"
      >
        <li
          *ngIf="!newPasswordControl?.errors?.['passwordPolicy'].hasMinLength"
        >
          Minimum 9 caractères requis.
        </li>
        <li
          *ngIf="!newPasswordControl?.errors?.['passwordPolicy'].hasUppercase"
        >
          Au moins une majuscule requise.
        </li>
        <li *ngIf="!newPasswordControl?.errors?.['passwordPolicy'].hasNumber">
          Au moins un chiffre requis.
        </li>
      </ul>

      <div
        *ngIf="resetPasswordForm?.errors?.['passwordsDoNotMatch'] && resetPasswordForm?.dirty"
      >
        Les mots de passe ne correspondent pas.
      </div>

      <button
        mat-flat-button
        [ngClass]="
          resetPasswordForm?.valid
            ? 'bg-light-success text-success'
            : 'bg-light text-dark'
        "
        (click)="modifyPassword()"
        [disabled]="resetPasswordForm?.invalid"
      >
        <div class="d-flex align-items-center">
          <i-tabler class="icon-20 m-r-4" name="password"></i-tabler>
          <span class="m-4">Modifier mot de passe</span>
        </div>
      </button>
    </form>
  </mat-card-content>
</mat-card>
