<div style="display: flex">
  <mat-expansion-panel style="width: 25%; margin: 1rem" [expanded]="true">
    <br />
    <br />
    <div style="display: grid; justify-items: center">
      @if(user.image){
      <img [src]="user.image" style="height: 10rem; border-radius: 5rem" />
      } @else {
      <button
        mat-fab
        color="accent"
        [disabled]="true"
        style="height: 10rem; width: 10rem"
      >
        <mat-icon style="height: 5rem; width: 5rem">person</mat-icon>
      </button>
      }
      <button
        mat-mini-fab
        color="accent"
        style="margin-left: 6rem; margin-top: -2rem"
        (click)="openPopInAvatar()"
      >
        <mat-icon>edit</mat-icon>
      </button>
      <br />
      <span>{{ user.username }}</span>
    </div>
  </mat-expansion-panel>
  <mat-divider [vertical]="true"></mat-divider>
  <mat-expansion-panel style="width: 70%; margin: 1rem" [expanded]="true">
    <br />
    <br />
    <form [formGroup]="editProfilForm!" style="display: grid">
      <mat-form-field class="fields" appearance="outline">
        <mat-label>Nom</mat-label>
        <input
          matInput
          type="text"
          [formControlName]="NAME_FIELD"
          [value]="user.name"
        />
      </mat-form-field>
      <br />
      <mat-form-field class="fields" appearance="outline">
        <mat-label>Prenom</mat-label>
        <input
          matInput
          type="text"
          [formControlName]="FIRSTNAME_FIELD"
          [value]="user.firstname"
        />
      </mat-form-field>
      <br />
      <mat-form-field class="fields" appearance="outline">
        <mat-label>Nom d'utilisateur</mat-label>
        <input
          matInput
          type="text"
          [formControlName]="USERNAME_FIELD"
          [value]="user.username"
        />
      </mat-form-field>
      <br />
      <mat-form-field class="fields" appearance="outline">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="text"
          [formControlName]="EMAIL_FIELD"
          [value]="user.email"
        />
      </mat-form-field>
      <br />
      <mat-form-field class="fields" appearance="outline">
        <mat-label>Taille</mat-label>
        <input
          matInput
          type="number"
          [formControlName]="HEIGHT_FIELD"
          [value]="user.height"
        />
      </mat-form-field>
      <br />
      <mat-form-field class="fields" appearance="outline">
        <mat-label>Poids</mat-label>
        <input
          matInput
          type="number"
          [formControlName]="WEIGHT_FIELD"
          [value]="user.name"
        />
      </mat-form-field>
      <br />
      <mat-form-field appearance="outline">
        <mat-label>Genre</mat-label>
        <mat-select
          [formControlName]="GENDER_FIELD"
          [compareWith]="compareCategoryObjects"
        >
          @for (gender of genders; track $index) {
          <mat-option [value]="gender.id">{{ gender.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
    <br />
    <button mat-flat-button color="accent" (click)="updateUser()">
      <mat-icon>person</mat-icon>
      Modifier
    </button>
  </mat-expansion-panel>
</div>
