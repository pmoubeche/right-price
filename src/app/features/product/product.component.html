<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">Rechercher des produits</mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1">
    <app-search-product
      (eventHttpProductsChange)="onHttpProductsChange($event)"
      (eventHttpProductChange)="onHttpProductChange($event)"
    ></app-search-product>
    <app-list-product [httpProducts]="httpProducts"></app-list-product>
  </mat-card-content>
</mat-card>
