<mat-expansion-panel
  class="meal-breakfast-panel"
  [expanded]="isExpandedBreakfast"
>
  <mat-expansion-panel-header>
    <mat-panel-title> Petit déjeuner </mat-panel-title>
  </mat-expansion-panel-header>
  <app-table-generic
    [isPaginated]="false"
    (onDeleteItem)="deleteLProductMeal($event)"
    (onValidateUpdateItem)="updateLProductMealQuantity($event)"
    (eventSelectLine)="onSelectLine($event)"
    [isClickable]="true"
    [columns]="columnParamsMeal"
    [paginatedDataSource]="dataSourceBreakfast"
    [rowHeight]="'40px'"
  ></app-table-generic>
</mat-expansion-panel>
<br />
