@if(isError$ | async){
<div style="display: grid; justify-items: center">
  <img
    style="opacity: 70%"
    src="../../../../assets/svg/flat-design-no-data-illustration_23-2150527130.avif"
  />
  <p>
    Oops ! Il y a eu un soucis lors de la récupération des données ... Ca
    devrait revenir plus tard ...
  </p>
</div>
} @else {
<div class="mat-elevation-z8" style="display: grid; justify-content: center">
  <div
    [ngClass]="isLineDisposal ? 'card-wrapper-line' : 'card-wrapper-table'"
    style="--nb: {{ countProductPerLine }}"
    cdkDropList
    [cdkDropListData]="productsAttributesToDisplay"
    (cdkDropListDropped)="drop($event)"
  >
    @for (productInfoModel of productsAttributesToDisplay; track $index) {
    <mat-card
      [ngClass]="isSelectableCard ? 'card-link' : ''"
      style="
        display: flex;
        justify-content: space-between;
        width: 240px;
        height: 380px;
        margin: 0.5rem;
      "
      (click)="onSelectItem(productInfoModel)"
      cdkDrag
    >
      <mat-card-header style="display: flex; padding: 1rem">
        <mat-card-title style="font-size: 14px">{{
          productInfoModel?.label!
        }}</mat-card-title>
      </mat-card-header>
      <div class="product-image">
        <img
          mat-card-image
          src="{{ productInfoModel?.image }}"
          style="height: 90%; width: auto"
        />
      </div>
      <mat-card-actions class="mat-card-actions">
        <img
          mat-card-image
          class="product-score"
          src="{{ productInfoModel?.nutriscore }}"
        />
        <img
          mat-card-image
          class="product-score"
          src="{{ productInfoModel?.ecoscore }}"
        />
        <img
          mat-card-image
          class="product-score"
          src="{{ productInfoModel?.novagroup }}"
        />
      </mat-card-actions>
    </mat-card>
    }
  </div>
  @if(isPaginated && httpProducts !== undefined){
  <br />
  <mat-paginator
    style="display: flex; justify-content: center"
    [length]="httpProducts.count"
    [pageIndex]="httpProducts.page"
    [pageSize]="httpProducts.page_size"
    [pageSizeOptions]="[httpProducts.page_count!]"
    (page)="onPageChange($event)"
    showFirstLastButtons
    aria-label="Select page"
  >
  </mat-paginator>
  }
</div>
}
