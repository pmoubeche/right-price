@if(isError$ | async){
<div class="d-grid justify-items-center op-5">
  <img
    src="../../../../assets/svg/flat-design-no-data-illustration_23-2150527130.avif"
  />
  <p>
    Oops ! Il y a eu un soucis lors de la récupération des données ... Ca
    devrait revenir plus tard ...
  </p>
</div>
} @else {
<div class="d-flex flex-column justify-items-center">
  <div class="position-relative d-flex flex-wrap-wrap justify-content-center">
    @if(isLoading$ | async){
    <div class="spinner-overlay">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
    } @for (productInfoModel of productsAttributesToDisplay; track $index) {
    <app-card-product
      [productInfoModel]="productInfoModel"
      [isClickable]="true"
      (click)="onSelectItem(productInfoModel)"
    ></app-card-product>
    }
  </div>
  @if(isPaginated && httpProducts !== undefined){
  <br />
  <mat-paginator
    class="d-flex justify-content-center"
    [length]="httpProducts.count"
    [pageIndex]="httpProducts.page"
    [pageSize]="httpProducts.page_size"
    [pageSizeOptions]="[httpProducts.page_count!]"
    (page)="onPageChange($event)"
    showFirstLastButtons
  >
  </mat-paginator>
  }
</div>
}
