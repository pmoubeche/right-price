<div>
  @if(user$ | async; as user){ @if(user.image){
  <div class="cursor-pointer border-primary rounded-circle">
    <ngx-avatars
      src="{{ user.image }}"
      [matMenuTriggerFor]="menu"
      [round]="true"
    ></ngx-avatars>
  </div>
  } }

  <mat-menu #menu="matMenu">
    @if (user$ | async; as user) {
    <button mat-menu-item [routerLink]="'/settings/' + user.id">
      <div class="d-flex align-items-center">
        <i-tabler class="icon-20 m-r-4" name="settings"></i-tabler>
        <label>Parametres</label>
      </div>
    </button>
    @if (hasUserAdminRole(user.roles)) {
    <button mat-menu-item [routerLink]="'/administration'">
      <div class="d-flex align-items-center">
        <i-tabler class="icon-20 m-r-4" name="user-cog"></i-tabler>
        <label>Administration</label>
      </div>
    </button>
    }
    <button mat-menu-item (click)="logOut()">
      <div class="d-flex align-items-center">
        <i-tabler class="icon-20 m-r-4" name="logout"></i-tabler>
        <label>Se deconnecter</label>
      </div>
    </button>
    }
  </mat-menu>
</div>
