<mat-sidenav-container class="blue_theme light-theme" style="height: 100%">
  <mat-sidenav #sidenav opened="true" mode="side" class="sidebarNav p-y-16">
    <mat-nav-list class="sidebar-list">
      @for (item of listItemsGuests; track $index) {
      <a
        mat-list-item
        [ngClass]="{
          activeMenu: item.route ? router.isActive(item.route, true) : false
        }"
        class="menu-list-item"
        (click)="onItemSelected(item)"
      >
        <i-tabler
          class="routeIcon"
          name="{{ item.icon }}"
          matListItemIcon
        ></i-tabler>
        <span class="hide-menu" matListItemTitle>{{ item.title }}</span>
      </a>
      } @for (item of listItemsSuscribers; track $index) {
      <a
        mat-list-item
        [ngClass]="{
          activeMenu: item.route ? router.isActive(item.route, true) : false
        }"
        class="menu-list-item"
        (click)="onItemSelected(item)"
        [disabled]="!item.enabled"
      >
        <i-tabler
          class="routeIcon"
          name="{{ !item.enabled ? 'lock' : item.icon }}"
          matListItemIcon
        ></i-tabler>
        <span class="hide-menu" matListItemTitle>{{ item.title }}</span>
      </a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content
    style="padding: 1rem 1rem 1rem 2rem; height: -webkit-fill-available"
  >
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
