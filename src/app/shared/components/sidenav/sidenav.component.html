<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    opened="true"
    mode="side"
    class="app-sidenav"
    aria-label="Sidebar"
  >
    <mat-nav-list>
      <mat-list-item
        [routerLink]="['/product']"
        routerLinkActive="router-link-active"
      >
        <div>
          <mat-icon> shopping_cart</mat-icon>
          <span>Aliment</span>
        </div>
      </mat-list-item>

      <mat-list-item
        [routerLink]="['/compare']"
        routerLinkActive="router-link-active"
      >
        <div>
          <mat-icon> compare_arrows</mat-icon>
          <span>Comparer</span>
        </div>
      </mat-list-item>
      <mat-list-item
        [routerLink]="['/meal']"
        routerLinkActive="router-link-active"
        [disabled]="!isAuthorizedMealAccess"
      >
        <div>
          <mat-icon> local_dining</mat-icon>
          <span>Repas</span>
          @if(!isAuthorizedMealAccess){
          <mat-icon matSuffix>lock</mat-icon>
          }
        </div>
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>
  <app-sidenav-content></app-sidenav-content>
</mat-sidenav-container>
