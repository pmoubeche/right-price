<mat-sidenav-container class="app-container">
  <mat-sidenav
    opened="true"
    disableClose="true"
    #sidenav
    mode="side"
    [class.mat-elevation-z4]="true"
    class="app-sidenav"
  >
    <mat-nav-list>
      <mat-list-item
        [routerLink]="['/product']"
        routerLinkActive="router-link-active"
      >
        <button
          mat-button
          style="display: inline-flex; padding: 1rem 1rem 1rem 1rem"
        >
          <mat-icon>shopping_cart</mat-icon>
          <span>Aliment</span>
        </button>
      </mat-list-item>

      <mat-list-item
        [routerLink]="['/compare']"
        routerLinkActive="router-link-active"
      >
        <div style="display: inline-flex; padding: 1rem 1rem 1rem 1rem">
          <mat-icon> compare_arrows</mat-icon>
          <span>Comparer</span>
        </div>
      </mat-list-item>
      <mat-list-item
        [routerLink]="['/meal']"
        routerLinkActive="router-link-active"
        [disabled]="!isAuthorizedMealAccess"
      >
        <div style="display: inline-flex; padding: 1rem 1rem 1rem 1rem">
          <mat-icon> local_dining</mat-icon>
          <span>Repas</span>
          @if(!isAuthorizedMealAccess){
          <mat-icon matSuffix>lock</mat-icon>
          }
        </div>
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>
  <app-sidenav-content></app-sidenav-content>
</mat-sidenav-container>
