<mat-sidenav-container class="app-container">
  <mat-sidenav
    opened="true"
    disableClose="true"
    #sidenav
    mode="side"
    [class.mat-elevation-z4]="true"
    class="app-sidenav"
  >
    <mat-nav-list>
      <mat-list-item
        [routerLink]="['/product']"
        routerLinkActive="router-link-active"
      >
        <mat-icon>shopping_cart</mat-icon>
        <span>Product</span>
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>
  <app-sidenav-content></app-sidenav-content>
</mat-sidenav-container>
