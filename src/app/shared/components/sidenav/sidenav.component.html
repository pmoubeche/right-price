<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    opened="true"
    mode="side"
    class="app-sidenav"
    aria-label="Sidebar"
  >
    <mat-nav-list>
      <a
        mat-list-item
        [routerLink]="['/product']"
        routerLinkActive="router-link-active"
      >
        <mat-icon matListItemIcon> shopping_cart</mat-icon>
        <span matListItemTitle>Aliment</span>
      </a>

      <a
        mat-list-item
        [routerLink]="['/compare']"
        routerLinkActive="router-link-active"
      >
        <mat-icon matListItemIcon> compare_arrows</mat-icon>
        <span matListItemTitle>Comparer</span>
      </a>
      <a
        mat-list-item
        [routerLink]="['/meal']"
        routerLinkActive="router-link-active"
        [disabled]="!isAuthorizedMealAccess"
      >
        <mat-icon matListItemIcon> local_dining</mat-icon>
        <span matListItemTitle>Repas</span>
        @if(!isAuthorizedMealAccess){
        <mat-icon matListItemIcon matSuffix>lock</mat-icon>
        }
      </a>
      <a
        mat-list-item
        [routerLink]="['/grocery-list']"
        routerLinkActive="router-link-active"
        [disabled]="!isAuthorizedMealAccess"
      >
        <mat-icon matListItemIcon> playlist_add</mat-icon>
        <span matListItemTitle>Liste de courses</span>
        @if(!isAuthorizedMealAccess){
        <mat-icon matListItemIcon matSuffix>lock</mat-icon>
        }
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <app-sidenav-content></app-sidenav-content>
</mat-sidenav-container>
