<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="b-t-1 mat-typography">
  <div class="d-flex flex-wrap-wrap justify-content-between gap-24 p-t-16">
    @for(avatar of avatars; track $index){
    <mat-card class="card-hover rounded-circle" (click)="onClickAvatar(avatar)">
      <img [src]="avatar" class="ah-72 rounded-circle" />
    </mat-card>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  @for(button of data.buttons; track $index){ @if(button.isIntialyFocused) {
  <button
    mat-button
    [color]="button.color"
    (click)="(button.action)"
    cdkFocusInitial
  >
    <mat-label>{{ button.label }}</mat-label>
    <mat-icon> {{ button.icon }}</mat-icon>
  </button>
  } @else if (button.isCloseButton) {
  <button mat-button color="danger" mat-dialog-close cdkFocusInitial>
    <mat-label>{{ button.label }}</mat-label>
    <mat-icon>close</mat-icon>
  </button>
  } @else {
  <button
    mat-button
    [color]="button.color"
    [mat-dialog-close]="button.isCloseButton"
    (click)="(button.action)"
  >
    <mat-label>{{ button.label }}</mat-label>
    <mat-icon> {{ button.icon }}</mat-icon>
  </button>
  } }
</mat-dialog-actions>
