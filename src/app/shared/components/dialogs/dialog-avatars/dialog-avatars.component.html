<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="mat-typography">
  <div
    style="
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 2rem;
    "
  >
    @for(avatar of avatars; track $index){
    <mat-card
      class="avatar-link"
      style="border-radius: 4rem; margin: 1rem"
      (click)="onClickAvatar(avatar)"
    >
      <img
        [src]="avatar"
        style="height: 6rem; border-radius: 3rem; padding: 1rem"
      />
    </mat-card>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  @for(button of data.buttons; track $index){ @if(button.isIntialyFocused) {
  <button
    mat-button
    [color]="button.color"
    (click)="(button.action)"
    cdkFocusInitial
  >
    <mat-label>{{ button.label }}</mat-label>
    <mat-icon> {{ button.icon }}</mat-icon>
  </button>
  } @else if (button.isCloseButton) {
  <button mat-button color="danger" mat-dialog-close cdkFocusInitial>
    <mat-label>{{ button.label }}</mat-label>
    <mat-icon>close</mat-icon>
  </button>
  } @else {
  <button
    mat-button
    [color]="button.color"
    [mat-dialog-close]="button.isCloseButton"
    (click)="(button.action)"
  >
    <mat-label>{{ button.label }}</mat-label>
    <mat-icon> {{ button.icon }}</mat-icon>
  </button>
  } }
</mat-dialog-actions>
