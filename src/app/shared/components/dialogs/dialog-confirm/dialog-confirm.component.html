<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="mat-typography">
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button (click)="onConfirm()" [ngClass]="getCardClasses()">
    <div class="d-flex align-items-center">
      @if(data.isLoading$! | async){
      <mat-spinner class="spinner-color-dark" [diameter]="20"></mat-spinner>
      } @else {
      <i-tabler class="icon-20 m-r-4" name="{{ data.icon }}"></i-tabler>
      }
      <span class="m-4">Confirmer</span>
    </div>
  </button>
  <button mat-button mat-dialog-close>
    <div class="d-flex align-items-center">
      <i-tabler class="icon-20 m-r-4" name="x"></i-tabler
      ><span class="m-4">Fermer</span>
    </div>
  </button>
</mat-dialog-actions>
