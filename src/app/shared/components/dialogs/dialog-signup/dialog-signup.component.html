<h2 mat-dialog-title>Créer un compte</h2>
<mat-dialog-content
  class="mat-typography d-flex flex-column align-items-center"
>
  <app-login-google
    [isSignin]="true"
    (eventLogin)="loginAndClosePopUp($event)"
  ></app-login-google>

  <div class="or-border m-t-30">Ou créer un compte avec avec :</div>

  <form [formGroup]="signupForm!" class="m-t-30">
    <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Adresse email</mat-label>
    <mat-form-field class="w-100" color="primary" appearance="outline">
      <input
        matInput
        type="email"
        [formControlName]="EMAIL_INPUT"
        placeholder="Ex. aa@bb.com"
        required
      />
      @if(emailControl.invalid){
      <mat-error>Champ obligatoire</mat-error>
      }
    </mat-form-field>
    <mat-label class="f-s-14 f-w-600 m-b-12 d-block"
      >Nom d'utilisateur</mat-label
    >
    <mat-form-field class="w-100" color="primary" appearance="outline">
      <input matInput type="text" [formControlName]="USERNAME_INPUT" required />
      @if(usernameControl.invalid){
      <mat-error>Champ obligatoire</mat-error>
      }
    </mat-form-field>
    <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Mot de passe</mat-label>
    <mat-form-field class="w-100" color="primary" appearance="outline">
      <input
        matInput
        type="password"
        [formControlName]="PASSWORD_INPUT"
        required
        (keydown.enter)="signUp()"
      />
      @if(passwordControl.invalid){
      <mat-error>Champ obligatoire</mat-error>
      }
    </mat-form-field>
  </form>

  <span class="d-block f-w-500 text-center m-t-24"
    >Vous avez déjà un compte ?
    <a
      href
      (click)="redirectSignInPopin($event)"
      class="text-decoration-none text-primary f-w-500 f-s-14"
    >
      Se connecter</a
    >
  </span>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-flat-button
    class="bg-light-success text-success"
    (click)="signUp()"
  >
    <div class="d-flex align-items-center">
      <i-tabler class="icon-20 m-r-4" name="user"></i-tabler>
      <span class="m-4">Créér un compte</span>
    </div>
  </button>
  <button mat-button mat-dialog-close>
    <div class="d-flex align-items-center">
      <i-tabler class="icon-20 m-r-4" name="x"></i-tabler
      ><span class="m-4">Fermer</span>
    </div>
  </button>
</mat-dialog-actions>
