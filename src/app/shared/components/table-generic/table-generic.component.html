<div class="mat-elevation-z8">
  @if (paginatedDataSource.dataSource && this.loading === false) {
  <table
    mat-table
    [dataSource]="paginatedDataSource.dataSource"
    matSort
    (matSortChange)="announceSortChange($event)"
  >
    @for (column of columns; track $index) {
    <ng-container [matColumnDef]="column.columDef!">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        sortActionDescription="Sort by {{ column.columDef }}"
      >
        {{ column.label }}
      </th>
      <td mat-cell *matCellDef="let element">
        <div
          style="
            margin-top: 5px;
            margin-bottom: 5%;
            display: grid;
            justify-content: center;
          "
        >
          @if(column.type! === columnTypeEnum.IMAGE){
          <img src="{{ element[column.columDef!] }}" height="80px" />
          } @else {
          <strong>{{ element[column.columDef!] }}</strong>
          }
        </div>
      </td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="paginatedDataSource.count"
    [pageIndex]="paginatedDataSource.page"
    [pageSize]="paginatedDataSource.pageSize"
    [pageSizeOptions]="[24]"
    (page)="onPageChange($event)"
    showFirstLastButtons
    aria-label="Select page"
  >
  </mat-paginator>
  } @else {
  <mat-spinner style="margin: 0 auto"></mat-spinner>
  }
</div>
