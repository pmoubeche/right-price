<mat-card
  class="m-t-16 overflow-hidden shadow"
  [ngClass]="isClickable ? 'card-hover m-8 aw-300' : ''"
  (click)="onClick(); $event.stopPropagation()"
>
  <div class="d-flex justify-content-between ah-160">
    <div class="d-grid justify-content-center p-8">
      <mat-card-title
        class="d-flex justify-content-start align-items-start gap-4"
      >
        <div class="d-flex flex-column">
          @if(displayFavoriteButton) {
          <button
            mat-icon-button
            type="button"
            (click)="clickFav(productInfoModel, $event)"
          >
            <i-tabler
              name="heart"
              class="{{ productInfoModel.isFavorite ? 'fill-error' : '' }}"
            ></i-tabler>
          </button>
          } @if(displayDeleteFavoriteButton) {
          <button
            mat-icon-button
            type="button"
            (click)="deleteFav(productInfoModel, $event)"
          >
            <i-tabler name="trash"></i-tabler>
          </button>
          }
        </div>
        <span class="f-s-14 m-4">
          {{ productInfoModel.label! }}
        </span>
      </mat-card-title>
      <div class="d-flex gap-4 justify-content-start p-y-8 m-t-auto">
        <img
          mat-card-image
          class="ah-32 w-auto"
          src="{{ productInfoModel.nutriscore }}"
        />
        <img
          mat-card-image
          class="ah-32 w-auto p-x-8"
          src="{{ productInfoModel.ecoscore }}"
        />
        <img
          mat-card-image
          class="ah-32 w-auto"
          src="{{ productInfoModel.novagroup }}"
        />
      </div>
    </div>
    <div class="d-flex justify-content-center align-items-center">
      <img
        mat-card-image
        class="ah-160 w-160"
        src="{{ productInfoModel.image }}"
      />
    </div>
  </div>
</mat-card>
